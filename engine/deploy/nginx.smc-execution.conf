# Replace domains and certificate paths. Keep the Python service on 127.0.0.1:8080.
server {
    listen 443 ssl http2;
    server_name execution.example.com;

    ssl_certificate     /etc/letsencrypt/live/execution.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/execution.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name execution.example.com;
    return 301 https://$host$request_uri;
}
