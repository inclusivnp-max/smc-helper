services:
  smc-execution:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      # Bind inside the container; host exposure remains loopback-only below.
      OPERATOR_HOST: 0.0.0.0
      OPERATOR_BEHIND_HTTPS_PROXY: "true"
      OPERATOR_TRUSTED_PROXY_IPS: "127.0.0.1"
      BINANCE_TRADE_API_KEY_FILE: /run/secrets/binance_trade_api_key
      BINANCE_TRADE_API_SECRET_FILE: /run/secrets/binance_trade_api_secret
      BINANCE_USER_DATA_API_KEY_FILE: /run/secrets/binance_user_data_api_key
      BINANCE_USER_DATA_API_SECRET_FILE: /run/secrets/binance_user_data_api_secret
      BINANCE_MONITOR_API_KEY_FILE: /run/secrets/binance_monitor_api_key
      BINANCE_MONITOR_API_SECRET_FILE: /run/secrets/binance_monitor_api_secret
      OPERATOR_TOKEN_FILE: /run/secrets/operator_token
      REDIS_URL: redis://redis:6379/0
      STATE_DB: /var/lib/smc-execution/execution_state.db
      OPERATOR_DB: /var/lib/smc-execution/operator.db
      RESEARCH_DB: /var/lib/smc-execution/research.db
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./var:/var/lib/smc-execution
    secrets:
      - source: binance_trade_api_key
      - source: binance_trade_api_secret
      - source: binance_user_data_api_key
      - source: binance_user_data_api_secret
      - source: binance_monitor_api_key
      - source: binance_monitor_api_secret
      - source: operator_token
    networks:
      - default
      - smc-backend
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

secrets:
  binance_trade_api_key:
    file: ./credentials/binance_trade_api_key
  binance_trade_api_secret:
    file: ./credentials/binance_trade_api_secret
  binance_user_data_api_key:
    file: ./credentials/binance_user_data_api_key
  binance_user_data_api_secret:
    file: ./credentials/binance_user_data_api_secret
  binance_monitor_api_key:
    file: ./credentials/binance_monitor_api_key
  binance_monitor_api_secret:
    file: ./credentials/binance_monitor_api_secret
  operator_token:
    file: ./credentials/operator_token

networks:
  smc-backend:
    name: smc-execution-backend
    internal: true
